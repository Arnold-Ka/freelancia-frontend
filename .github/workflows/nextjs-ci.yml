name: Next.js CI

on:
  push:
    branches: [ "**" ]        
  pull_request:
    branches: [ "**" ]        

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20   

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Build Next.js
        run: npm run build

